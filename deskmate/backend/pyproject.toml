[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deskmate-backend"
version = "0.1.0"
description = "DeskMate 后端平台与多智能体系统"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlmodel>=0.0.24,<0.1", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "PyJWT>=2.10,<3", "jsonschema>=4.23,<5",
  "anyio>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/ws/edge_hub.py" = ["ASYNC109"] # 契约规定 call(tool, args, timeout)
"tests/test_runtime.py" = ["ASYNC109"] # 测试替身保留同一签名
