services:
  backend:
    build:
      context: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/deskmate.db
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  backend_data:
